services:
  video_in:
    image: containers.openfilter.io/plainsightai/openfilter-video-in:1.2.1
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: VideoIn
      FILTER_SOURCES: file:///video.mp4!sync!loop
      FILTER_OUTPUTS: tcp://*
    volumes:
      - ${VIDEO_INPUT:-./data/sample-video.mp4}:/video.mp4
  frame_dedup_filter:
    image: containers.openfilter.io/plainsightai/openfilter-frame-dedup:1.2.0
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: FrameDedupFilter
      FILTER_SOURCES: tcp://video_in
      FILTER_OUTPUTS: tcp://*
      FILTER_OUTPUT_FOLDER: /output
    volumes:
      - ${HOST_OUTPUT:-./output}:/output

  webvis:
    image: containers.openfilter.io/plainsightai/openfilter-webvis:1.2.1
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILTER_ID: Webvis
      FILTER_SOURCES: tcp://frame_dedup_filter
    ports:
      - 8001:8000
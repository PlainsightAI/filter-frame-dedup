[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["filter_frame_dedup"]  # Specify the package directory

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[project]
name = "filter_frame_dedup"
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = "Apache-2.0"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

dynamic = ["version"]

dependencies = [
  "scikit-image==0.25.2",
  "openfilter[all]>=1.3.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "setuptools>=83.0.0",
  "twine>=6.1.0,<7",
  "wheel>=0.46.2",
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",

  # duplicate here to ensure tests are passing
  "filter-frame-dedup[model]"
] 

model = [
  "torch>=2.0.0",
  "transformers>=4.56.0",
  "torchvision", 
  "safetensors>=0.3",
  "huggingface-hub>=0.14",
]

[[tool.uv.index]]
name = "openfilter"
url = "https://python.openfilter.io/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
